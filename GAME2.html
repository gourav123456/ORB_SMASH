<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NEON HIGHWAY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03040a;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #03040a;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ==============================
   HUD
============================== */

.hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    padding: 18px;

    z-index: 20;

    pointer-events: none;
}

.logo {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 3px;

    color: #00f7ff;

    text-shadow:
        0 0 10px #00f7ff,
        0 0 25px #00f7ff;
}

.hud-right {
    display: flex;
    gap: 7px;
}

.stat {
    min-width: 72px;

    padding: 7px 10px;

    text-align: center;

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 10px;

    background: rgba(0,0,0,.38);

    backdrop-filter: blur(8px);
}

.stat-label {
    color: #707080;
    font-size: 7px;
    letter-spacing: 1.5px;
}

.stat-value {
    margin-top: 3px;

    color: white;

    font-size: 15px;
    font-weight: 900;
}

/* ==============================
   NITRO
============================== */

.nitro-wrap {
    position: absolute;

    left: 18px;
    bottom: 25px;

    width: 145px;

    z-index: 20;

    pointer-events: none;
}

.nitro-label {
    margin-bottom: 5px;

    color: #777;
    font-size: 8px;
    letter-spacing: 2px;
}

.nitro {
    width: 100%;
    height: 6px;

    overflow: hidden;

    border-radius: 20px;

    background: rgba(255,255,255,.1);
}

.nitro-fill {
    height: 100%;
    width: 100%;

    transform-origin: left;

    background:
        linear-gradient(
            90deg,
            #7c4dff,
            #00f7ff
        );

    box-shadow:
        0 0 12px #00f7ff;
}

/* ==============================
   START / GAME OVER
============================== */

.overlay {
    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(30,15,70,.45),
            rgba(0,0,0,.92)
        );

    backdrop-filter: blur(7px);

    transition: opacity .4s;
}

.overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.panel {
    width: min(520px, 90%);

    text-align: center;
}

.title {
    color: white;

    font-size: clamp(45px, 12vw, 100px);

    line-height: .82;

    font-weight: 1000;

    letter-spacing: -6px;

    text-shadow:
        4px 4px 0 #ff168d,
        8px 8px 0 #633cff,
        0 0 50px rgba(0,247,255,.4);

    margin-bottom: 25px;
}

.description {
    color: #858592;

    font-size: 11px;

    line-height: 1.8;

    letter-spacing: 1px;

    margin-bottom: 30px;
}

.button {
    border: none;

    padding: 15px 38px;

    border-radius: 100px;

    color: #02030a;

    background:
        linear-gradient(
            90deg,
            #00f7ff,
            white,
            #ff168d
        );

    font-size: 12px;
    font-weight: 1000;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 25px rgba(0,247,255,.3);

    transition: transform .2s;
}

.button:hover {
    transform: scale(1.07);
}

.best {
    margin-top: 22px;

    color: #555565;

    font-size: 9px;

    letter-spacing: 2px;
}

.best span {
    color: #00f7ff;
}

/* ==============================
   CONTROLS
============================== */

.controls {
    position: absolute;

    bottom: 22px;
    right: 18px;

    z-index: 30;

    display: flex;
    gap: 8px;
}

.control {
    width: 46px;
    height: 46px;

    border: 1px solid rgba(255,255,255,.15);

    border-radius: 12px;

    background: rgba(0,0,0,.4);

    color: white;

    font-size: 18px;

    cursor: pointer;
}

.control:active {
    transform: scale(.9);
}

@media (min-width: 800px) {
    .controls {
        display: none;
    }
}

/* ==============================
   GAME OVER
============================== */

#gameOver {
    display: none;
}

#gameOver.show {
    display: flex;
}

.game-over-title {
    color: #ff168d;

    font-size: clamp(42px, 10vw, 80px);

    font-weight: 1000;

    text-shadow:
        0 0 15px #ff168d,
        0 0 50px #ff168d;

    margin-bottom: 12px;
}

.final-score {
    color: white;

    font-size: 55px;

    font-weight: 1000;
}

.final-distance {
    margin: 7px 0 25px;

    color: #777;

    font-size: 10px;

    letter-spacing: 2px;
}

/* ==============================
   MOBILE HINT
============================== */

.hint {
    position: absolute;

    bottom: 82px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    color: rgba(255,255,255,.35);

    font-size: 8px;

    letter-spacing: 2px;

    white-space: nowrap;

    pointer-events: none;
}

@media (min-width: 800px) {
    .hint {
        display: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <!-- HUD -->

    <div class="hud">

        <div class="logo">
            NEON HIGHWAY
        </div>

        <div class="hud-right">

            <div class="stat">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">DISTANCE</div>
                <div class="stat-value" id="distance">
                    0m
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">LIVES</div>
                <div class="stat-value" id="lives">
                    ♥♥♥
                </div>
            </div>

        </div>

    </div>


    <!-- Nitro -->

    <div class="nitro-wrap">

        <div class="nitro-label">
            NITRO [SPACE]
        </div>

        <div class="nitro">
            <div
                class="nitro-fill"
                id="nitroFill"
            ></div>
        </div>

    </div>


    <!-- Mobile controls -->

    <div class="controls">

        <button
            class="control"
            id="leftBtn"
        >
            ◀
        </button>

        <button
            class="control"
            id="nitroBtn"
        >
            ⚡
        </button>

        <button
            class="control"
            id="rightBtn"
        >
            ▶
        </button>

    </div>


    <div class="hint">
        ← → MOVE &nbsp;&nbsp; SPACE = NITRO
    </div>


    <!-- Start -->

    <div
        class="overlay"
        id="startScreen"
    >

        <div class="panel">

            <h1 class="title">
                NEON<br>
                HIGHWAY
            </h1>

            <p class="description">
                DODGE THE TRAFFIC.<br>
                COLLECT ENERGY.<br>
                SURVIVE AS LONG AS POSSIBLE.
            </p>

            <button
                class="button"
                id="startButton"
            >
                START ENGINE
            </button>

            <div class="best">
                BEST:
                <span id="menuBest">0</span>
            </div>

        </div>

    </div>


    <!-- Game over -->

    <div
        class="overlay"
        id="gameOver"
    >

        <div class="panel">

            <div class="game-over-title">
                CRASHED
            </div>

            <div
                class="final-score"
                id="finalScore"
            >
                0
            </div>

            <div
                class="final-distance"
                id="finalDistance"
            >
                0m
            </div>

            <button
                class="button"
                id="restartButton"
            >
                DRIVE AGAIN
            </button>

        </div>

    </div>

</div>


<script>

/*
=========================================================
NEON HIGHWAY
=========================================================

100% OFFLINE.

No:
- external images
- external fonts
- libraries
- APIs
- servers

Everything is rendered using Canvas.
=========================================================
*/


/* ======================================================
   CANVAS SETUP
====================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;


function resize() {

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* ======================================================
   DOM
====================================================== */

const scoreElement =
    document.getElementById("score");

const distanceElement =
    document.getElementById("distance");

const livesElement =
    document.getElementById("lives");

const nitroElement =
    document.getElementById("nitroFill");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const menuBest =
    document.getElementById("menuBest");

const finalScore =
    document.getElementById("finalScore");

const finalDistance =
    document.getElementById("finalDistance");


/* ======================================================
   GAME STATE
====================================================== */

let running = false;

let score = 0;

let distance = 0;

let lives = 3;

let nitro = 100;

let level = 1;

let speed = 5;

let roadScroll = 0;

let lastTime = 0;

let spawnTimer = 0;

let coinTimer = 0;

let shake = 0;

let invincible = 0;

let best =
    Number(
        localStorage.getItem(
            "neonHighwayBest"
        )
    ) || 0;


/* ======================================================
   INPUT
====================================================== */

const keys = {
    left: false,
    right: false,
    nitro: false
};


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {
            keys.left = true;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {
            keys.right = true;
        }

        if (
            event.code === "Space"
        ) {
            event.preventDefault();

            keys.nitro = true;
        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {
            keys.left = false;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {
            keys.right = false;
        }

        if (
            event.code === "Space"
        ) {
            keys.nitro = false;
        }

    }
);


/* ======================================================
   MOBILE CONTROLS
====================================================== */

function holdButton(
    element,
    property
) {

    element.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[property] = true;

        }
    );

    element.addEventListener(
        "pointerup",
        () => {

            keys[property] = false;

        }
    );

    element.addEventListener(
        "pointercancel",
        () => {

            keys[property] = false;

        }
    );

    element.addEventListener(
        "pointerleave",
        () => {

            keys[property] = false;

        }
    );
}


holdButton(
    document.getElementById("leftBtn"),
    "left"
);

holdButton(
    document.getElementById("rightBtn"),
    "right"
);

holdButton(
    document.getElementById("nitroBtn"),
    "nitro"
);


/* ======================================================
   ROAD
====================================================== */

const road = {

    center: 0,

    width: 0,

    lanes: 3
};


function updateRoad() {

    /*
        Road width scales with screen.
    */

    road.width =
        Math.min(
            W * .72,
            600
        );

    road.center =
        W / 2;

}


updateRoad();

window.addEventListener(
    "resize",
    updateRoad
);


/* ======================================================
   PLAYER
====================================================== */

const player = {

    x: 0,

    y: 0,

    width: 42,

    height: 72,

    targetX: 0,

    tilt: 0
};


function resetPlayer() {

    player.x =
        road.center;

    player.targetX =
        road.center;

    player.y =
        H * .78;

    player.tilt = 0;

}


resetPlayer();


/* ======================================================
   OBJECTS
====================================================== */

let obstacles = [];

let coins = [];

let particles = [];


/* ======================================================
   START GAME
====================================================== */

function startGame() {

    running = true;

    score = 0;

    distance = 0;

    lives = 3;

    nitro = 100;

    level = 1;

    speed = 5;

    roadScroll = 0;

    spawnTimer = 0;

    coinTimer = 0;

    shake = 0;

    invincible = 0;

    obstacles = [];

    coins = [];

    particles = [];

    resetPlayer();

    updateHUD();

    startScreen.classList.add(
        "hidden"
    );

    gameOver.classList.remove(
        "show"
    );

    lastTime =
        performance.now();

    requestAnimationFrame(
        loop
    );

    beep(
        250,
        .1
    );

    setTimeout(
        () => beep(500, .15),
        100
    );

}


/* ======================================================
   GAME OVER
====================================================== */

function endGame() {

    running = false;

    if (score > best) {

        best = score;

        localStorage.setItem(
            "neonHighwayBest",
            best
        );

    }

    menuBest.textContent =
        best;

    finalScore.textContent =
        score;

    finalDistance.textContent =
        Math.floor(distance) + " METERS";

    gameOver.classList.add(
        "show"
    );

    beep(
        80,
        .35,
        "sawtooth"
    );

}


/* ======================================================
   HUD
====================================================== */

function updateHUD() {

    scoreElement.textContent =
        Math.floor(score);

    distanceElement.textContent =
        Math.floor(distance) + "m";

    livesElement.textContent =
        "♥".repeat(lives) +
        "♡".repeat(3 - lives);

    nitroElement.style.transform =
        `scaleX(${nitro / 100})`;

}


/* ======================================================
   SPAWN OBSTACLE
====================================================== */

function spawnObstacle() {

    const laneWidth =
        road.width /
        road.lanes;

    const lane =
        Math.floor(
            Math.random() *
            road.lanes
        );

    const x =
        road.center -
        road.width / 2 +
        laneWidth * lane +
        laneWidth / 2;

    const types = [
        "car",
        "barrier",
        "truck"
    ];

    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    obstacles.push({

        x: x,

        y: -100,

        width:
            type === "truck"
                ? 48
                : 40,

        height:
            type === "truck"
                ? 85
                : 70,

        type: type,

        color:
            randomCarColor(),

        counted: false

    });

}


/* ======================================================
   SPAWN COIN
====================================================== */

function spawnCoin() {

    const laneWidth =
        road.width /
        road.lanes;

    const lane =
        Math.floor(
            Math.random() *
            road.lanes
        );

    const x =
        road.center -
        road.width / 2 +
        laneWidth * lane +
        laneWidth / 2;

    coins.push({

        x: x,

        y: -30,

        radius: 11,

        rotation: 0

    });

}


/* ======================================================
   COLORS
====================================================== */

function randomCarColor() {

    const colors = [
        "#ff245f",
        "#7c4dff",
        "#00c8ff",
        "#ff9d00",
        "#38ff88",
        "#ff4bd8"
    ];

    return colors[
        Math.floor(
            Math.random() *
            colors.length
        )
    ];

}


/* ======================================================
   MAIN LOOP
====================================================== */

function loop(time) {

    if (!running) return;

    const delta =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );

    lastTime = time;

    update(delta);

    draw();

    requestAnimationFrame(
        loop
    );

}


/* ======================================================
   UPDATE
====================================================== */

function update(delta) {

    /*
        Difficulty increases
        gradually.
    */

    level =
        1 +
        Math.floor(
            distance / 500
        );

    speed =
        5 +
        level * .55;

    /*
        Nitro
    */

    let currentSpeed =
        speed;

    if (
        keys.nitro &&
        nitro > 0
    ) {

        currentSpeed *= 1.75;

        nitro -= .65 * delta;

    }
    else {

        nitro += .08 * delta;

    }

    nitro =
        Math.max(
            0,
            Math.min(
                100,
                nitro
            )
        );

    /*
        Distance
    */

    distance +=
        currentSpeed *
        .025 *
        delta;

    score +=
        currentSpeed *
        .08 *
        delta;

    /*
        Road animation
    */

    roadScroll +=
        currentSpeed *
        delta;

    /*
        Player movement
    */

    const movement =
        8 * delta;

    if (keys.left) {

        player.targetX -=
            movement;

        player.tilt = -.12;

    }
    else if (keys.right) {

        player.targetX +=
            movement;

        player.tilt = .12;

    }
    else {

        player.tilt *= .88;

    }

    /*
        Keep player inside road.
    */

    const leftEdge =
        road.center -
        road.width / 2 +
        35;

    const rightEdge =
        road.center +
        road.width / 2 -
        35;

    player.targetX =
        Math.max(
            leftEdge,
            Math.min(
                rightEdge,
                player.targetX
            )
        );

    /*
        Smooth movement.
    */

    player.x +=
        (
            player.targetX -
            player.x
        ) * .18 * delta;

    /*
        Spawn rate becomes faster.
    */

    spawnTimer +=
        delta;

    const spawnRate =
        Math.max(
            24,
            65 - level * 2.5
        );

    if (
        spawnTimer >=
        spawnRate
    ) {

        spawnTimer = 0;

        spawnObstacle();

        /*
            Occasionally create
            a second obstacle.
        */

        if (
            level > 4 &&
            Math.random() < .18
        ) {

            spawnObstacle();

        }

    }

    /*
        Coins
    */

    coinTimer += delta;

    if (coinTimer > 42) {

        coinTimer = 0;

        spawnCoin();

    }

    /*
        Move obstacles
    */

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];

        obstacle.y +=
            currentSpeed *
            delta;

        /*
            Collision
        */

        if (
            invincible <= 0 &&
            collision(
                player,
                obstacle
            )
        ) {

            crash(
                obstacle
            );

            obstacles.splice(
                i,
                1
            );

            continue;

        }

        /*
            Remove objects
            below screen.
        */

        if (
            obstacle.y >
            H + 120
        ) {

            obstacles.splice(
                i,
                1
            );

            /*
                Reward successful dodge.
            */

            if (
                !obstacle.counted
            ) {

                obstacle.counted =
                    true;

                score += 8;

            }

        }

    }

    /*
        Move coins
    */

    for (
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coins[i];

        coin.y +=
            currentSpeed *
            delta;

        coin.rotation +=
            .08 * delta;

        /*
            Coin collision
        */

        if (
            coinCollision(
                player,
                coin
            )
        ) {

            score += 50;

            nitro =
                Math.min(
                    100,
                    nitro + 12
                );

            createCoinParticles(
                coin.x,
                coin.y
            );

            beep(
                800,
                .08
            );

            coins.splice(
                i,
                1
            );

            continue;

        }

        if (
            coin.y >
            H + 50
        ) {

            coins.splice(
                i,
                1
            );

        }

    }

    /*
        Invincibility
    */

    if (invincible > 0) {

        invincible -= delta;

    }

    /*
        Particles
    */

    updateParticles(delta);

    /*
        Screen shake
    */

    shake *= .88;

    updateHUD();

}


/* ======================================================
   COLLISION
====================================================== */

function collision(
    a,
    b
) {

    const padding = 9;

    return (
        Math.abs(
            a.x - b.x
        ) <
        (
            a.width +
            b.width
        ) / 2 - padding

        &&

        Math.abs(
            a.y - b.y
        ) <
        (
            a.height +
            b.height
        ) / 2 - padding
    );

}


/* ======================================================
   COIN COLLISION
====================================================== */

function coinCollision(
    car,
    coin
) {

    const dx =
        car.x -
        coin.x;

    const dy =
        car.y -
        coin.y;

    return (
        Math.sqrt(
            dx * dx +
            dy * dy
        ) <
        35
    );

}


/* ======================================================
   CRASH
====================================================== */

function crash(
    obstacle
) {

    lives--;

    invincible =
        100;

    shake =
        18;

    createCrashParticles(
        obstacle.x,
        obstacle.y
    );

    beep(
        90,
        .2,
        "sawtooth"
    );

    updateHUD();

    if (lives <= 0) {

        endGame();

    }

}


/* ======================================================
   DRAW
====================================================== */

function draw() {

    /*
        Clear
    */

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    /*
        Screen shake
    */

    if (shake > 0) {

        ctx.translate(
            (
                Math.random() -
                .5
            ) * shake,

            (
                Math.random() -
                .5
            ) * shake
        );

    }

    drawSky();

    drawRoad();

    drawCoins();

    drawObstacles();

    drawPlayer();

    drawParticles();

    ctx.restore();

}


/* ======================================================
   SKY
====================================================== */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#03030b"
    );

    gradient.addColorStop(
        .5,
        "#100629"
    );

    gradient.addColorStop(
        1,
        "#050510"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        Neon horizon
    */

    const horizon =
        H * .37;

    const glow =
        ctx.createRadialGradient(
            W / 2,
            horizon,
            0,
            W / 2,
            horizon,
            W * .5
        );

    glow.addColorStop(
        0,
        "rgba(255,30,170,.2)"
    );

    glow.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
        City silhouettes
    */

    drawCity(
        horizon
    );

}


/* ======================================================
   CITY
====================================================== */

function drawCity(
    horizon
) {

    const buildingWidth =
        25;

    const count =
        Math.ceil(
            W /
            buildingWidth
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const height =
            20 +
            (
                (
                    i * 37
                ) % 100
            );

        const x =
            i *
            buildingWidth;

        ctx.fillStyle =
            i % 3 === 0
                ? "#08091a"
                : "#0b0a20";

        ctx.fillRect(
            x,
            horizon - height,
            buildingWidth - 3,
            height
        );

        /*
            Windows
        */

        if (i % 2 === 0) {

            ctx.fillStyle =
                "rgba(0,247,255,.35)";

            for (
                let y =
                    horizon -
                    height +
                    10;

                y <
                    horizon - 8;

                y += 14
            ) {

                ctx.fillRect(
                    x + 7,
                    y,
                    3,
                    5
                );

            }

        }

    }

}


/* ======================================================
   ROAD
====================================================== */

function drawRoad() {

    const horizon =
        H * .37;

    const bottom =
        H + 100;

    const roadTop =
        road.width * .12;

    /*
        Road body
    */

    ctx.beginPath();

    ctx.moveTo(
        road.center -
        roadTop / 2,
        horizon
    );

    ctx.lineTo(
        road.center +
        roadTop / 2,
        horizon
    );

    ctx.lineTo(
        road.center +
        road.width / 2,
        bottom
    );

    ctx.lineTo(
        road.center -
        road.width / 2,
        bottom
    );

    ctx.closePath();

    const roadGradient =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            bottom
        );

    roadGradient.addColorStop(
        0,
        "#10121f"
    );

    roadGradient.addColorStop(
        1,
        "#070812"
    );

    ctx.fillStyle =
        roadGradient;

    ctx.fill();

    /*
        Road edges
    */

    ctx.strokeStyle =
        "#00eaff";

    ctx.lineWidth = 3;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00eaff";

    ctx.beginPath();

    ctx.moveTo(
        road.center -
        roadTop / 2,
        horizon
    );

    ctx.lineTo(
        road.center -
        road.width / 2,
        bottom
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        road.center +
        roadTop / 2,
        horizon
    );

    ctx.lineTo(
        road.center +
        road.width / 2,
        bottom
    );

    ctx.stroke();

    ctx.shadowBlur = 0;

    /*
        Lane markings
    */

    const laneWidth =
        road.width /
        road.lanes;

    for (
        let lane = 1;
        lane < road.lanes;
        lane++
    ) {

        const bottomX =
            road.center -
            road.width / 2 +
            laneWidth *
            lane;

        const topX =
            road.center -
            roadTop / 2 +
            roadTop *
            (
                lane /
                road.lanes
            );

        const segments = 18;

        for (
            let i = 0;
            i < segments;
            i++
        ) {

            /*
                Perspective.
            */

            const p1 =
                (
                    i +
                    (
                        roadScroll /
                        50
                    )
                ) % segments;

            const p =
                p1 / segments;

            const p2 =
                Math.min(
                    1,
                    p + .035
                );

            const y1 =
                horizon +
                Math.pow(
                    p,
                    1.7
                ) *
                (bottom - horizon);

            const y2 =
                horizon +
                Math.pow(
                    p2,
                    1.7
                ) *
                (bottom - horizon);

            const x1 =
                topX +
                (
                    bottomX -
                    topX
                ) * p;

            const x2 =
                topX +
                (
                    bottomX -
                    topX
                ) * p2;

            ctx.strokeStyle =
                "rgba(150,240,255,.7)";

            ctx.lineWidth =
                2 +
                p * 3;

            ctx.beginPath();

            ctx.moveTo(
                x1,
                y1
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();

        }

    }

    /*
        Roadside neon lights
    */

    drawRoadLights(
        horizon,
        bottom
    );

}


/* ======================================================
   ROAD LIGHTS
====================================================== */

function drawRoadLights(
    horizon,
    bottom
) {

    const count = 20;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const p =
            (
                (
                    i * 0.07 +
                    roadScroll / 800
                ) % 1
            );

        const y =
            horizon +
            Math.pow(
                p,
                1.8
            ) *
            (bottom - horizon);

        const roadHalf =
            (
                road.width * .12 / 2
            ) +
            (
                road.width / 2 -
                road.width * .12 / 2
            ) * p;

        const size =
            2 +
            p * 6;

        for (
            const side of [-1, 1]
        ) {

            const x =
                road.center +
                side *
                (
                    roadHalf +
                    25 +
                    p * 25
                );

            ctx.fillStyle =
                side === -1
                    ? "#ff1493"
                    : "#00f7ff";

            ctx.shadowBlur =
                15;

            ctx.shadowColor =
                ctx.fillStyle;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

    }

    ctx.shadowBlur = 0;

}


/* ======================================================
   DRAW PLAYER
====================================================== */

function drawPlayer() {

    /*
        Blink after crash.
    */

    if (
        invincible > 0 &&
        Math.floor(
            invincible / 6
        ) % 2 === 0
    ) {

        return;

    }

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(
        player.tilt
    );

    /*
        Nitro flames
    */

    if (keys.nitro && nitro > 0) {

        const flame =
            ctx.createLinearGradient(
                0,
                35,
                0,
                90
            );

        flame.addColorStop(
            0,
            "#ffffff"
        );

        flame.addColorStop(
            .25,
            "#00f7ff"
        );

        flame.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle =
            flame;

        ctx.beginPath();

        ctx.moveTo(
            -10,
            30
        );

        ctx.lineTo(
            0,
            80 +
            Math.random() * 20
        );

        ctx.lineTo(
            10,
            30
        );

        ctx.closePath();

        ctx.fill();

    }

    /*
        Glow
    */

    ctx.shadowBlur =
        25;

    ctx.shadowColor =
        "#00f7ff";

    /*
        Car body
    */

    const body =
        ctx.createLinearGradient(
            -22,
            0,
            22,
            0
        );

    body.addColorStop(
        0,
        "#00a8c0"
    );

    body.addColorStop(
        .5,
        "#f4ffff"
    );

    body.addColorStop(
        1,
        "#008fa8"
    );

    ctx.fillStyle =
        body;

    roundRect(
        ctx,
        -21,
        -36,
        42,
        72,
        10
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
        Windows
    */

    ctx.fillStyle =
        "#080d19";

    roundRect(
        ctx,
        -15,
        -24,
        30,
        23,
        7
    );

    ctx.fill();

    /*
        Window reflection
    */

    ctx.fillStyle =
        "rgba(0,247,255,.25)";

    ctx.beginPath();

    ctx.moveTo(
        -12,
        -21
    );

    ctx.lineTo(
        8,
        -21
    );

    ctx.lineTo(
        12,
        -7
    );

    ctx.lineTo(
        -8,
        -7
    );

    ctx.closePath();

    ctx.fill();

    /*
        Headlights
    */

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowBlur =
        15;

    ctx.shadowColor =
        "#ffffff";

    ctx.fillRect(
        -15,
        -33,
        9,
        5
    );

    ctx.fillRect(
        6,
        -33,
        9,
        5
    );

    /*
        Tail lights
    */

    ctx.fillStyle =
        "#ff1744";

    ctx.shadowColor =
        "#ff1744";

    ctx.fillRect(
        -15,
        27,
        9,
        5
    );

    ctx.fillRect(
        6,
        27,
        9,
        5
    );

    ctx.restore();

}


/* ======================================================
   DRAW OBSTACLES
====================================================== */

function drawObstacles() {

    for (
        const obstacle of obstacles
    ) {

        ctx.save();

        ctx.translate(
            obstacle.x,
            obstacle.y
        );

        /*
            Glow
        */

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            obstacle.color;

        if (
            obstacle.type ===
            "barrier"
        ) {

            drawBarrier(
                obstacle
            );

        }
        else {

            drawTrafficCar(
                obstacle
            );

        }

        ctx.restore();

    }

}


/* ======================================================
   TRAFFIC CAR
====================================================== */

function drawTrafficCar(
    car
) {

    const w =
        car.width;

    const h =
        car.height;

    /*
        Body
    */

    ctx.fillStyle =
        car.color;

    roundRect(
        ctx,
        -w / 2,
        -h / 2,
        w,
        h,
        8
    );

    ctx.fill();

    /*
        Dark windows
    */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#070914";

    roundRect(
        ctx,
        -w * .32,
        -h * .30,
        w * .64,
        h * .25,
        5
    );

    ctx.fill();

    /*
        Windows reflection
    */

    ctx.fillStyle =
        "rgba(255,255,255,.12)";

    ctx.fillRect(
        -w * .25,
        -h * .27,
        w * .45,
        3
    );

    /*
        Lights
    */

    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        "#ff203f";

    ctx.fillStyle =
        "#ff203f";

    ctx.fillRect(
        -w * .32,
        h * .32,
        w * .2,
        5
    );

    ctx.fillRect(
        w * .12,
        h * .32,
        w * .2,
        5
    );

}


/* ======================================================
   BARRIER
====================================================== */

function drawBarrier(
    barrier
) {

    const w =
        barrier.width;

    const h =
        barrier.height;

    ctx.shadowBlur =
        12;

    ctx.shadowColor =
        "#ff9d00";

    ctx.fillStyle =
        "#ff8c00";

    roundRect(
        ctx,
        -w / 2,
        -h / 2,
        w,
        h,
        5
    );

    ctx.fill();

    /*
        Black stripes
    */

    ctx.save();

    ctx.clip();

    ctx.fillStyle =
        "#15151c";

    for (
        let x = -w;
        x < w * 2;
        x += 18
    ) {

        ctx.save();

        ctx.translate(
            x,
            0
        );

        ctx.rotate(
            -.5
        );

        ctx.fillRect(
            0,
            -h,
            8,
            h * 2
        );

        ctx.restore();

    }

    ctx.restore();

}


/* ======================================================
   DRAW COINS
====================================================== */

function drawCoins() {

    for (
        const coin of coins
    ) {

        ctx.save();

        ctx.translate(
            coin.x,
            coin.y
        );

        ctx.rotate(
            coin.rotation
        );

        ctx.shadowBlur =
            20;

        ctx.shadowColor =
            "#ffe600";

        ctx.fillStyle =
            "#ffe600";

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            coin.radius,
            coin.radius * .35,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 10px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "$",
            0,
            0
        );

        ctx.restore();

    }

}


/* ======================================================
   PARTICLES
====================================================== */

function createCrashParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 12,

            vy:
                (
                    Math.random() -
                    .5
                ) * 12,

            life: 1,

            color:
                Math.random() >
                .5
                    ? "#ff1744"
                    : "#ff9d00"

        });

    }

}


function createCoinParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (
                    Math.random() -
                    .5
                ) * 8,

            vy:
                (
                    Math.random() -
                    .5
                ) * 8,

            life: 1,

            color:
                "#ffe600"

        });

    }

}


function updateParticles(
    delta
) {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx * delta;

        p.y +=
            p.vy * delta;

        p.vy +=
            .25 * delta;

        p.life -=
            .035 * delta;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}


function drawParticles() {

    for (
        const p of particles
    ) {

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            p.color;

        ctx.shadowBlur =
            10;

        ctx.shadowColor =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

    ctx.shadowBlur = 0;

}


/* ======================================================
   ROUND RECT
====================================================== */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    context.beginPath();

    context.moveTo(
        x + r,
        y
    );

    context.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        r
    );

    context.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        r
    );

    context.arcTo(
        x,
        y + height,
        x,
        y,
        r
    );

    context.arcTo(
        x,
        y,
        x + width,
        y,
        r
    );

    context.closePath();

}


/* ======================================================
   SOUND
====================================================== */

let audioContext = null;


function beep(
    frequency,
    duration,
    type = "sine"
) {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            .08,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }
    catch (error) {

        /*
            Audio is optional.
            The game continues if the
            browser blocks audio.
        */

    }

}


/* ======================================================
   BUTTONS
====================================================== */

startButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


restartButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* ======================================================
   INITIAL STATE
====================================================== */

menuBest.textContent =
    best;

updateHUD();

draw();


/* ======================================================
   SECRET EASTER EGG
====================================================== */

let secret = "";

document.addEventListener(
    "keydown",
    event => {

        secret +=
            event.key.toLowerCase();

        secret =
            secret.slice(-5);

        /*
            Type TURBO.
        */

        if (
            secret === "turbo" &&
            running
        ) {

            nitro = 100;

            score += 250;

            secret = "";

            beep(
                1000,
                .4,
                "square"
            );

        }

    }
);
